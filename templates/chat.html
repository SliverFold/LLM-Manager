<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ name }} — chat</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #161922; --border: #2a2f3a;
      --fg: #e6e8ee; --muted: #8a91a0; --accent: #4f8cff;
      --user: #24304a; --bot: #1b202c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--fg);
      display: flex; flex-direction: column; height: 100vh;
    }
    header {
      padding: 12px 16px; background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header .model { font-size: 12px; color: var(--muted); font-family: monospace; }
    header .status { margin-left: auto; font-size: 12px; color: var(--muted); }
    main {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg {
      max-width: 75%; padding: 10px 14px; border-radius: 12px;
      font-size: 14px; line-height: 1.5; white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end; background: var(--user);
      border: 1px solid var(--border); border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start; background: var(--bot);
      border: 1px solid var(--border); border-bottom-left-radius: 4px;
    }
    .msg.error {
      align-self: flex-start; background: #3a1f1f;
      border: 1px solid #5a2a2a; color: #ffb4a8;
    }
    .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    footer {
      padding: 12px 16px; background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex; gap: 10px;
    }
    footer input {
      flex: 1; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--fg); font-size: 14px;
    }
    footer input:focus { outline: none; border-color: var(--accent); }
    footer button {
      padding: 10px 18px; border-radius: 8px; border: none;
      background: var(--accent); color: #fff; font-size: 14px;
      font-weight: 600; cursor: pointer;
    }
    footer button:disabled { opacity: 0.5; cursor: not-allowed; }
    .typing { color: var(--muted); font-size: 13px; align-self: flex-start; padding: 4px 0; }
  </style>
</head>
<body>
  <header>
    <h1>{{ name }}</h1>
    <span class="model" id="model-name">loading model…</span>
    <span class="status" id="status"></span>
  </header>
  <main id="chat">
    <div class="msg bot">
      <div class="who">model</div>
      <div id="greeting">Connecting to the model…</div>
    </div>
  </main>
  <footer>
    <input id="input" type="text" placeholder="Type a message and press Enter…" disabled />
    <button id="send" disabled>Send</button>
  </footer>
  <script>
    const PORT = {{ port }};
    // LM Studio uses a metrics proxy (port 11436) to capture throughput stats.
    // Other loaders connect to the server directly.
    const USE_PROXY = {{ loader }} === 'lmstudio';
    const PROXY_PORT = 11436;
    const BASE = `http://127.0.0.1:${USE_PROXY ? PROXY_PORT : PORT}/v1`;
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const modelEl = document.getElementById('model-name');
    const statusEl = document.getElementById('status');
    const greetingEl = document.getElementById('greeting');
    let modelName = 'default';
    let history = [];  // {role, content}
    let busy = false;

    function addMsg(role, text, isError = false) {
      const div = document.createElement('div');
      div.className = 'msg ' + (isError ? 'error' : (role === 'user' ? 'user' : 'bot'));
      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = role;
      const body = document.createElement('div');
      body.textContent = text;
      div.appendChild(who);
      div.appendChild(body);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return body;
    }

    // Discover the served model name from the model's own API.
    async function discoverModel() {
      try {
        const res = await fetch(BASE + '/models');
        const data = await res.json();
        const models = (data.data || []);
        if (models.length > 0) {
          modelName = models[0].id;
          modelEl.textContent = modelName;
          greetingEl.textContent = 'Ready. Ask me anything.';
          input.disabled = false;
          sendBtn.disabled = false;
        } else {
          modelEl.textContent = '(no models listed — using "default")';
          input.disabled = false;
          sendBtn.disabled = false;
        }
      } catch (e) {
        modelEl.textContent = '(API unreachable)';
        greetingEl.textContent = 'Could not reach the model API. Is the service running?';
        statusEl.textContent = 'offline';
      }
    }

    async function send() {
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = '';
      input.disabled = true;
      sendBtn.disabled = true;
      busy = true;
      addMsg('user', text);
      history.push({ role: 'user', content: text });

      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.textContent = '…';
      chat.appendChild(typing);
      chat.scrollTop = chat.scrollHeight;

      const botBody = addMsg('assistant', '');
      try {
        const res = await fetch(BASE + '/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: modelName,
            messages: history,
            stream: true,
          }),
        });
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`HTTP ${res.status}: ${errText.slice(0, 300)}`);
        }
        // Stream the SSE response.
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let full = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          // Process complete SSE lines.
          let idx;
          while ((idx = buffer.indexOf('\n')) >= 0) {
            let line = buffer.slice(0, idx).trim();
            buffer = buffer.slice(idx + 1);
            if (!line.startsWith('data:')) continue;
            let payload = line.slice(5).trim();
            if (payload === '[DONE]') continue;
            try {
              const chunk = JSON.parse(payload);
              const delta = (chunk.choices && chunk.choices[0] && chunk.choices[0].delta) || {};
              if (delta.content) {
                full += delta.content;
                botBody.textContent = full;
                chat.scrollTop = chat.scrollHeight;
              }
            } catch (e) {
              // ignore malformed chunk
            }
          }
        }
        history.push({ role: 'assistant', content: full });
      } catch (e) {
        botBody.parentElement.classList.add('error');
        botBody.textContent = 'Error: ' + e.message;
      } finally {
        typing.remove();
        busy = false;
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    discoverModel();
  </script>
</body>
</html>
